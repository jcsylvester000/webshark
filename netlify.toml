# Netlify build configuration for Slyshark (Next.js full-stack app in web/).
# The Next.js runtime (OpenNext adapter) is declared explicitly below: because the app lives in
# web/, Netlify's automatic framework detection can miss it and publish only static files (404s).
[build]
  base = "web"
  command = "npm run netlify-build"   # runs DB migrations, then next build
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Basic hardening headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
